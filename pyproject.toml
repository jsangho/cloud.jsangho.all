[project]
name = "cloud-jsangho-fastapi"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch==2.12.0",
    # **`torchvision`은 빼면 안 된다.** 코드가 직접 import하지는 않지만 `timm`이
    # 요구하는 실제 의존성이고, 여기서 지우면 CPU 인덱스 밖(PyPI)에서 해석돼
    # CUDA 휠이 딸려 와 이미지가 **더 커진다** (2026-08-10 실측).
    "torchvision==0.27.0",
    # `torchaudio`는 뺐다 — import 0건이고 timm도 안 쓴다 (2026-08-10).
    # EC2 디스크 30GB가 꽉 차 배포가 두 번 실패한 뒤 정리한 결과다.
    "fastapi==0.136.1",
    "uvicorn[standard]==0.47.0",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    "sqlalchemy[asyncio]==2.0.49",
    "psycopg[binary]==3.3.4",
    "pgvector==0.4.2",
    "sqlmodel==0.0.38",
    "alembic==1.18.4",
    "neo4j==6.2.0",
    "google-genai==2.11.0",
    "google-generativeai==0.8.6",
    "transformers==5.13.0",
    "mcp==1.28.1",
    "ollama==0.6.2",
    "kiwipiepy==0.23.1",
    "opencv-python-headless==5.0.0.93",
    "ultralytics==8.4.89",
    "timm==1.0.28",
    "decord==0.6.0",
    "pillow==12.3.0",
    "numpy==2.5.1",
    "pandas==3.0.3",
    "scikit-learn==1.8.0",
    "lightgbm==4.7.0",
    "xgboost==3.3.0",
    "matplotlib==3.11.0",
    "seaborn==0.13.2",
    "boto3==1.43.40",
    "python-dotenv==1.2.2",
    "redis==8.0.1",
    "beautifulsoup4==4.15.0",
    "pyjwt==2.10.1",
    "cryptography",
    "neo4j-graphrag>=1.18.0",
    "langchain-core>=1.5.1",
    "langchain-google-genai>=4.3.2",
    "langgraph>=1.2.9",
    "sentence-transformers>=5.6.1",
]

[project.optional-dependencies]
llm = [
    "huggingface_hub==1.23.0",
    "peft==0.19.1",
    "bitsandbytes==0.49.2",
    "accelerate==1.14.0",
    "datasets==5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "import-linter==2.12",
    "ruff==0.15.21",
    "aiosqlite>=0.22.1",
    "fakeredis[lua]>=2.37.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = [
    ".git",
    "__pycache__",
    # 저장소 루트에서 `ruff check fastapi/`로 돌리면 "alembic/"은 매칭되지 않아
    # 자동 생성 파일이 실제로 수정된다. 경로 어디에 있든 걸리도록 `**/`를 붙인다.
    "**/alembic/",
    "pytorch_env/",
    ".venv/",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line-length — ruff format handles this
    "B008",  # FastAPI Depends() in default args
    "N999",  # module name with hyphens (앱 디렉터리명)
    "N815",  # Pydantic 스키마 camelCase 필드 (API 응답 컨벤션)
    "N803",  # ML 관례 대문자 파라미터 (X, y) 및 API 파라미터
    "N806",  # 테스트 Mock 변수 명명 관례
]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]           # sys.path.insert 이후 import 구조적 필요
"auth_main.py" = ["E402"]      # sys.path.insert 이후 import 구조적 필요 (main.py와 동일)
"**/scripts/*.py" = ["E402"]   # standalone 스크립트 sys.path 조작
"**/apps/ontology/tests/*.py" = ["E402"]  # standalone 검증 스크립트 sys.path 조작

[tool.ruff.lint.isort]
known-first-party = [
    "jsangho",
    "ontology",
    "titanic",
    "kayfabe",
    "superstar",
    "auth",
    "human_resource",
    "imitation_game",
    "inception",
    "social_network",
    "manager",
]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
exclude = [
    "alembic/",
    "pytorch_env/",
    "__pycache__/",
]
