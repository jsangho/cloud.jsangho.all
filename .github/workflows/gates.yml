# 하네스 게이트 — `.pre-commit-config.yaml`과 같은 검사를 서버에서 한 번 더 돌린다.
#
# **왜 있는가.** 지금까지 게이트는 로컬 pre-commit 훅뿐이었고, 그 훅은 `pre-commit
# install`을 돌린 머신에만 있다. 실제로 한동안 config에만 있고 `.git/hooks/pre-commit`이
# 없어서 **골든 세트를 아무도 강제하지 않던 기간이 있었다**(KAYFABE Phase 11 때 발견).
# 클론을 새로 하거나 훅을 건너뛰면(`--no-verify`) 같은 구멍이 다시 열린다.
#
# **훅과 다른 점은 테스트 범위 하나다.** 훅은 커밋 흐름을 느리게 하지 않으려고
# 파일 둘(골든 세트 · 계보 사슬 E2E)만 돌리지만, 여기서는 그 제약이 없으므로
# `apps` 전체를 돌린다. 나머지 검사(ruff · import-linter · ESLint · tsc · prettier ·
# flutter analyze · dart format)는 훅과 **같은 명령**이다 — 한쪽만 고치면 둘이
# 어긋나므로 명령을 바꿀 때는 두 파일을 함께 본다.
name: gates

on:
  push:
    branches: [ho, main, messi]
  pull_request:

# 같은 브랜치에 연속으로 푸시하면 앞선 실행을 취소한다 — 무료 등급 분을 아낀다.
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff · import-linter · pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # **정확한 버전으로 핀한다.** 다른 액션들처럼 `@v10`으로 적으면 안 된다 —
      # `astral-sh/setup-uv`는 **`v7` 이후로 이동 major 태그를 발행하지 않는다**
      # (`tags/v10`이 404). 첫 CI 실행이 여기서 죽었다:
      # "Unable to resolve action astral-sh/setup-uv@v10, unable to find version v10".
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # `--locked`는 `uv.lock`이 `pyproject.toml`과 맞는지도 함께 검사한다 —
      # 의존을 손으로 고치고 `uv lock`을 안 돌린 커밋이 여기서 걸린다.
      - run: uv sync --locked

      - run: uv run ruff check fastapi/ --config pyproject.toml

      - run: uv run ruff format --check fastapi/ --config pyproject.toml

      # 스타 토폴로지 계약 — 스포크끼리 직접 import하면 깨진다.
      - name: import-linter (star topology)
        run: PYTHONUTF8=1 PYTHONPATH=apps uv run lint-imports
        working-directory: fastapi

      # **auth 모바일 테스트 10건이 실제로 토큰에 서명한다** — `JWT_PRIVATE_KEY`가
      # 없으면 `token_issuer._private_key()`가 RuntimeError를 낸다. 로컬에서는
      # 개발자 `.env`의 **운영 서명키**로 통과하고 있었다(러너에는 당연히 없고,
      # 넣어서도 안 되는 값이다). 그래서 실행마다 버리는 키페어를 만들어 준다 —
      # 테스트가 필요한 것은 *그* 키가 아니라 *어떤* RSA 키다.
      #
      # 개행을 `\n`으로 이스케이프해 한 줄로 넣는다. `.env.example`이 이 두 키를
      # 적는 형식과 같고, 읽는 쪽도 `.replace("\\n", "\n")`을 이미 한다.
      - name: 임시 RS256 키페어 (테스트 서명 전용, 실행마다 버린다)
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out "$RUNNER_TEMP/ci-jwt.pem"
          openssl rsa -in "$RUNNER_TEMP/ci-jwt.pem" -pubout -out "$RUNNER_TEMP/ci-jwt.pub"
          {
            echo "JWT_PRIVATE_KEY=$(awk '{printf "%s\\n", $0}' "$RUNNER_TEMP/ci-jwt.pem")"
            echo "JWT_PUBLIC_KEY=$(awk '{printf "%s\\n", $0}' "$RUNNER_TEMP/ci-jwt.pub")"
          } >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/ci-jwt.pem" "$RUNNER_TEMP/ci-jwt.pub"

      # **`.env`를 만들지 않는다.** 로컬 `.env`의 DB·Redis·Neo4j URL이 빈 값이면
      # `engine`이 `None`이 되어 `init_db()`가 즉시 return하는 "더미 모드"이고,
      # 파일이 아예 없는 CI도 같은 상태다. `.env.example`을 복사하면 오히려
      # 깨진다 — 그 템플릿의 `DATABASE_URL`은 `@pgvector:5432`를 가리키는
      # 비어 있지 않은 값이라, 러너에 없는 호스트에 붙으려 든다.
      # (`Keymaker`는 `.env`가 없으면 `load_dotenv`가 no-op이 되어 프로세스
      # 환경변수를 그대로 읽는다 — 위 키페어가 그래서 닿는다.)
      #
      # **제외 경로가 없다.** 수집을 중단시키던 얼굴인식 스크립트 둘은 2026-09-29에
      # 기능과 함께 지웠다(gitignore된 `model.pt`를 모듈 최상위에서 열어서 러너에서는
      # 영원히 `FileNotFoundError`였다). 남은 `image_classifier_interactor_test.py`도
      # 같은 모양의 수동 스크립트지만 **모델 로딩이 지연 방식**이라(`_ensure_loaded`)
      # 수집만으로는 가중치를 내려받지 않는다 — HF 캐시가 없는 러너에서도 안전하다.
      - name: pytest (apps)
        run: PYTHONUTF8=1 PYTHONPATH=apps uv run pytest apps -q
        working-directory: fastapi

  www:
    name: Next.js (ESLint · tsc · Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # **pnpm이 정본이다.** `www/`에 `package-lock.json`도 남아 있지만
      # 2026-07-06에 멈춰 있고, `pnpm-lock.yaml`은 `package.json`과 같은 커밋에서
      # 갱신된다(Vercel도 이쪽을 보고 빌드한다).
      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: www/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: www

      # 셋 다 `node_modules/.bin`의 shim을 거치지 않고 진입점을 직접 부른다 —
      # 훅과 같은 형태다(shim은 sh 스크립트라 `node`로 부르면 SyntaxError가 난다).
      - run: node node_modules/eslint/bin/eslint.js .
        working-directory: www

      - run: node node_modules/typescript/bin/tsc --noEmit -p tsconfig.json
        working-directory: www

      - run: node node_modules/prettier/bin/prettier.cjs --check .
        working-directory: www

  flutter:
    name: Flutter (analyze · format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 로컬과 같은 버전으로 고정한다 — 채널만 맞추면 분석기 판정이 러너에서
      # 조용히 달라진다.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: flutter

      - run: flutter analyze flutter/

      - run: dart format --set-exit-if-changed flutter/
