services:
  # ① 백엔드 서비스 (FastAPI)
  backend:
    build:
      context: .
      dockerfile: fastapi/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./fastapi/.env
    volumes:
      - .:/app
      # bge-m3(약 2.2GB) 등 HF 모델 캐시. 볼륨이 없으면 컨테이너를 재생성할 때마다
      # 다시 내려받아 첫 임베딩 호출이 매우 느려진다.
      - hf_cache:/root/.cache/huggingface
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_started
      pgvector:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped
  # ①-2 인증 게이트웨이 (auth) — apps/auth 단독 엔트리포인트, 포트 미노출.
  #     cloudflared는 auth_net의 고정 IP(172.28.0.2:9000)로 직접 라우팅한다.
  auth:
    build:
      context: .
      dockerfile: fastapi/Dockerfile
    env_file:
      - ./fastapi/.env
    volumes:
      - .:/app
    command: uvicorn auth_main:app --host 0.0.0.0 --port 9000
    networks:
      default: {}
      auth_net:
        ipv4_address: 172.28.0.2
    depends_on:
      redis:
        condition: service_started
      pgvector:
        condition: service_healthy
    restart: unless-stopped
  # ② n8n 워크플로우 자동화
  n8n:
    image: n8nio/n8n
    ports:
      - "5678:5678"
    # N8N_ENCRYPTION_KEY 는 env_file 로 주입 (아래 neo4j 주석과 같은 이유).
    # 주의: n8n 워크플로는 이 파일의 앱 비밀값도 $env 로 읽을 수 있다.
    env_file:
      - ./fastapi/.env
    environment:
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_HOST: n8n.jsangho.cloud
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.jsangho.cloud
    volumes:
      - ./data/n8n:/home/node/.n8n
    restart: unless-stopped

  # ③ Neo4j (Graph DB)
  neo4j:
    image: neo4j:5
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    # NEO4J_AUTH 는 env_file 로 주입한다 — compose 의 ${} 치환은 루트 .env 만 읽으므로
    # .env 가 fastapi/ 로 옮겨진 뒤에는 빈 값이 되어 인증이 깨진다.
    env_file:
      - ./fastapi/.env
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ④ Redis (Cache / Queue)
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # ⑤ pgvector (PostgreSQL + pgvector 확장)
  pgvector:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - "5432:5432"
    # POSTGRES_PASSWORD 는 env_file 로 주입 (위 neo4j 주석과 같은 이유).
    env_file:
      - ./fastapi/.env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: vectordb
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vectordb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ⑥ pgAdmin (PostgreSQL 관리 UI)
  pgadmin:
    image: dpage/pgadmin4
    restart: unless-stopped
    ports:
      - "5050:80"
    # PGADMIN_DEFAULT_EMAIL / PGADMIN_DEFAULT_PASSWORD 는 env_file 로 주입.
    env_file:
      - ./fastapi/.env
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - pgvector

volumes:
  neo4j_data:
  redis_data:
  pgvector_data:
  pgadmin_data:
  hf_cache:

networks:
  default: {}
  auth_net:
    ipam:
      config:
        - subnet: 172.28.0.0/24
