# KAYFABE 2.0 개발 결과 보고서 — 사이트 설정
#
# 이 파일은 `bundle exec jekyll serve` 시 자동으로 다시 읽히지 않는다.
# 값을 고쳤으면 서버 프로세스를 재시작한다.

# 정식 사업명. 표지 대제목과 <title> 에 쓴다.
title: WWE 경기 결과를 다중 AI 에이전트로 예측하고 그 근거와 정확도를 데이터로 검증하는 스포츠 분석 플랫폼
# 사업명이 길어 들어가지 않는 좁은 자리(상단 헤더, 푸터)에 쓰는 축약 제목.
title_short: 다중 에이전트 경기 예측·검증 플랫폼
# 본문 각 장 머리말에 쓰는 팀 마크. 사업명이 아니라 팀명이다.
brand: KayFabe
# 표지의 <title> 꼬리말. 없으면 jekyll-seo-tag 가 description 전문을 붙인다.
tagline: 개발 결과 보고서
email:
description: >- # this means to ignore newlines until "baseurl:"
  다중 에이전트 경기 예측·검증 플랫폼 개발 결과 보고서.
  요구사항 분석부터 시험 결과까지의 수행 내역을 정리한 문서입니다.
baseurl: "" # GitHub Actions 로 배포한다면 configure-pages 가 --baseurl 로 주입한다
# 사이트의 호스트. canonical·og:url 이 절대 경로로 나오려면 필요하다.
url: "https://jsangho.github.io"
github_username: jsangho

# 헤더 네비에 노출할 페이지. 표지(index.md)는 제외한다.
header_pages:
  - toc.md

# Build settings
theme: minima
plugins:
  - jekyll-feed

# front matter 없는 마크다운은 정적 파일로 그대로 복사되어 공개된다.
# 내부 문서는 반드시 여기에 넣는다.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
